# Temporary for Issue #37: removed before the branch merges.
name: deadline-probe
on:
  push:
    branches: ['fix/37-*']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node .github/probe/deadline.cjs 20
      # Under load, as in the CI failures: the whole suite runs its files in parallel beside the probe.
      - run: git config core.hooksPath .githooks
      - run: |
          (node --test --test-timeout=120000 tests/*.test.js > /dev/null 2>&1 || true) &
          node .github/probe/deadline.cjs 20
          wait
        shell: bash
