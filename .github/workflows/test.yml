# Runs tests on Linux, macOS and Windows; required paths and integration gates: docs/specs/repository.md.
name: test
# Any push runs on its own commit; a pull request into main also runs on the merge result GitHub would make.
on:
  push:
  pull_request:
    branches: [main, trial/v15-pr-ci-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is outside the ruleset's required checks; the integration rule still needs it to pass.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Same hooks setting as a local-merge clone; the tests make commits in temporary repositories.
      - run: git config core.hooksPath .githooks
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The project gate, read from .devflow.json as the pre-push hook reads it, so the two cannot drift apart.
      - run: eval "$(node -p "require('./.devflow.json').verify")"
        shell: bash
  trial-publisher-boundary:
    if: >-
      github.event_name == 'pull_request' && github.repository == 'wotjr1649/devflow' &&
      github.base_ref == 'trial/v15-pr-ci-20261127' &&
      (github.head_ref == 'test/175-v15-pr-ci-20261127-normal' || github.head_ref == 'test/175-v15-pr-ci-20261127-weak') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      TRIAL_CI_TOKEN: ${{ github.token }}
      TRIAL_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Confirm the trial CI token cannot publish the external verdict
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIAL_HEAD" =~ ^[0-9a-f]{40}$ ]]
          code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $TRIAL_CI_TOKEN" \
            --header 'Accept: application/vnd.github+json' --header 'Content-Type: application/json' \
            --data '{"state":"success","context":"devflow-trial/v15-evidence","description":"Trial canary: CI publication must be denied"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TRIAL_HEAD")
          if [[ "$code" != 403 ]]; then
            printf 'Unexpected commit-status response: %s\n' "$code" >&2
            exit 1
          fi
          printf 'TRIAL_STATUS_WRITE=denied HTTP=403\n'
